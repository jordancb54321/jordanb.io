<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jordan Betts | Fractal Renderer</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../project-shell.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="project-page">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header"><div class="wrap header-row"><a class="wordmark" href="/" aria-label="Jordan Betts, home">JORDAN B<span class="brand-dot" aria-hidden="true"></span></a><nav class="site-nav" aria-label="Primary"><a href="/">Portfolio</a><a href="/fractal/" aria-current="page">Fractal</a><a href="/sorting">Sorting</a><a href="/chess">Chess</a><a href="/learn">Study</a></nav></div></header>

  <main id="main" class="app-shell">
<div class="fractal-heading"><div>
        <p class="meta">Canvas / Maths</p>
        <h1>Fractal renderer<span class="red-dot" aria-hidden="true">.</span></h1>
        <p class="fractal-intro">Scroll to zoom. Drag to pan. Choose a preset to explore.</p>
      </div></div>
    <section class="viewer" aria-label="Fractal preview">
      <div class="viewer-toolbar">
        <button type="button" id="fitViewButton" class="secondary">Fit canvas</button>
        <span id="canvasInfo">0 x 0</span>
      </div>
      <div class="canvas-frame">
        <canvas id="fractalCanvas" aria-label="Fractal renderer canvas"></canvas>
      </div>
    </section>
    <aside class="control-panel" aria-label="Renderer settings">


      <form id="controls" class="controls">
        <label>
          Fractal
          <select id="fractalType" name="fractalType">
            <option value="mandelbrot">Mandelbrot</option>
            <option value="julia">Julia</option>
            <option value="burningShip">Burning Ship</option>
            <option value="tricorn">Tricorn</option>
            <option value="multibrot3">Multibrot Cubic</option>
            <option value="celtic">Celtic Mandelbrot</option>
            <option value="buffalo">Buffalo</option>
          </select>
        </label>

        <label>
          Preset
          <select id="presetSelect" name="presetSelect"></select>
        </label>

        <label>
          Max iterations
          <input id="iterations" name="iterations" type="range" min="50" max="2500" step="10" value="500">
          <span id="iterationsValue">500</span>
        </label>

        <label>
          Escape radius
          <input id="escapeRadius" name="escapeRadius" type="range" min="2" max="32" step="0.5" value="4">
          <span id="escapeRadiusValue">4.0</span>
        </label>

        <label>
          Color strength
          <input id="colorCycles" name="colorCycles" type="range" min="0.2" max="6" step="0.1" value="1.6">
          <span id="colorCyclesValue">1.6</span>
        </label>

        <label>
          Resolution scale
          <input id="resolutionScale" name="resolutionScale" type="range" min="0.25" max="1.5" step="0.05" value="1">
          <span id="resolutionScaleValue">1.00x</span>
        </label>

        <label>
          Palette
          <select id="palette" name="palette">
            <option value="ember">Ember</option>
            <option value="lagoon">Lagoon</option>
            <option value="ice">Ice</option>
            <option value="neon">Neon</option>
            <option value="mono">Mono</option>
            <option value="sunset">Sunset</option>
            <option value="aurora">Aurora</option>
            <option value="lava">Lava</option>
            <option value="forest">Forest</option>
            <option value="royal">Royal</option>
            <option value="candy">Candy</option>
            <option value="oceanic">Oceanic</option>
          </select>
        </label>

        <label class="inline-field">
          <input id="smoothColoring" name="smoothColoring" type="checkbox" checked>
          Smooth coloring
        </label>

        <fieldset class="julia-fields">
          <legend>Julia Constant</legend>
          <label>
            Real
            <input id="juliaReal" name="juliaReal" type="number" step="0.001" value="-0.8">
          </label>
          <label>
            Imaginary
            <input id="juliaImag" name="juliaImag" type="number" step="0.001" value="0.156">
          </label>
        </fieldset>

        <div class="button-row">
          <button type="button" id="renderButton">Render</button>
          <button type="button" id="autoZoomButton" class="secondary">Auto zoom</button>
          <button type="button" id="resetViewButton" class="secondary">Reset view</button>
          <button type="button" id="downloadButton" class="secondary">Save PNG</button>
        </div>
      </form>



      <section class="status-panel">
        <h2>Status</h2>
        <dl>
          <div>
            <dt>Center</dt>
            <dd id="centerValue">0.000000, 0.000000</dd>
          </div>
          <div>
            <dt>Zoom</dt>
            <dd id="zoomValue">1.00x</dd>
          </div>
          <div>
            <dt>Render</dt>
            <dd id="renderStatus">Idle</dd>
          </div>
        </dl>
      </section>
    </aside>


  </main>

  <script src="app.js?v=guided-auto-zoom-2"></script>
</body>
</html>
